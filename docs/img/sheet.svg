  <style>
    svg { color: #3a3a3a; fill: #fff; stroke: currentColor; stroke-width: 1; stroke-linecap: square; stroke-linejoin: miter; }
    * { transform-box: fill-box; transform-origin: 50% 50%; }
    text { fill: #8a8a8a; stroke: none; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 6.5px; letter-spacing: .06em; text-transform: uppercase; text-anchor: middle; }
