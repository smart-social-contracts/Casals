    @keyframes s-read { 0%, 2% { opacity: .15; } 8%, 70% { opacity: .6; } 85%, 100% { opacity: .15; } }
    @keyframes s-new { 0%, 24% { opacity: 0; } 34%, 82% { opacity: 1; } 92%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .s-new { opacity: 1; } }
