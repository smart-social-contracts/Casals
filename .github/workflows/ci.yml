# Fast, replica-free checks that run on every pull request and on pushes to
# main. The heavier integration / e2e suite (which spins up a local replica) is
# kept in integration.yml as a manual workflow.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Every version copy matches version.txt
        run: python scripts/check_versions.py

      - name: Every Python file compiles
        run: python -m compileall -q casals_cli src scripts packages/orchestration/baton/src tests

      - name: Ruff
        run: |
          pip install ruff==0.14.6
          ruff check casals_cli src scripts packages/orchestration/baton/src tests

      - name: src/main.py matches the @op registry
        run: python scripts/gen_main.py --check

  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      # Every op through the dispatcher against tests/unit/fake_chain.py, the
      # auth matrix, and the coverage gate (pyproject.toml). No replica.
      - name: Run unit tests
        run: pip install pytest-cov ic-python-db==0.11.0 && make unit PYTEST_ARGS=-v

  cli-guard:
    name: CLI carries no principal tables
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: No hard-coded canister or principal ids in the CLI
        # Every id and every controller/commander set comes from the sheet the operator passes in.
        run: |
          if grep -rnoE '\b[a-z0-9]{5}(-[a-z0-9]{5}){3,10}-[a-z0-9]{3}\b' casals_cli scripts --exclude-dir=examples | grep -v 'aaaaa-aa\b'; then
            echo "::error::canister/principal ids belong in a casals.json, not in the CLI"; exit 1
          fi

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      # vite build strips types. svelte-check type-checks the SvelteKit app,
      # including the Cycles page and the cycles bindings in lib/api.ts.
      - name: Type-check frontend
        run: npm --prefix frontend run check

      - name: Build frontend
        run: npm --prefix frontend run build

      # Orchestra tree cache + footer/build-identity helpers (node:test).
      - name: Frontend lib unit tests
        run: node --experimental-strip-types --test frontend/src/lib/*.test.ts

      - name: Frontend /version build-info tests
        run: node --test frontend/scripts/build-info.test.js frontend/scripts/monaco-chunks.test.js frontend/scripts/csp-hashes.test.js

  orchestration-unit:
    name: Orchestration unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      # Baton + Multisig pure helpers (no local replica). Each package is
      # pytest-run from its own directory — both ship tests/test_unit.py.
      - name: Run orchestration unit tests
        run: make -C packages/orchestration test-unit
