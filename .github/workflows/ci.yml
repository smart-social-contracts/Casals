# Fast, replica-free checks that run on every pull request and on pushes to
# main. The heavier integration / e2e suite (which spins up a local replica) is
# kept in integration.yml as a manual workflow.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      # Replica-free modules only (#57). test_sheetv2.py is the casals.json
      # syntax suite (validate + placeholder resolution); test_planner.py,
      # test_access_code.py, and test_control_rules.py cover what a valid
      # sheet means. The rest are pure helpers. None of these start a replica.
      # Live conductor coverage stays in the replica workflows.
      - name: Run unit tests
        run: >
          pytest -v
          tests/test_unit.py
          tests/test_version_http.py
          tests/test_sheetv2.py
          tests/test_planner.py
          tests/test_access_code.py
          tests/test_control_rules.py
          tests/test_bundle.py
          tests/test_core_layout.py
          tests/test_release_bookkeeping.py
          tests/test_store_uploads.py
          tests/test_wasm_store.py
          tests/test_cli_wasm_store.py
          tests/test_wasm_types.py
          tests/test_ic_assets.py
          tests/test_destroy_orchestra.py
          tests/test_replica.py
          tests/test_meter.py
          tests/test_asset_permission_did.py

  cli-unit:
    name: CLI unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # test_cli_v2.py patches ic-py's read_state helpers, so the CLI's runtime
      # deps are needed even though no replica is.
      - name: Install CLI deps
        run: pip install -r requirements-dev.txt

      # tests/test_cli_unit.py covers scripts/casals.py with no IC runtime:
      # _parse / _candid_unescape / _candid_text_arg helpers, the arg parser,
      # _load_sheet_file, call() subprocess wiring (mocked), error exit codes,
      # and a full subprocess suite using a pure-Python fake icp binary.
      - name: Run CLI unit tests
        run: pytest tests/test_cli_unit.py -v tests/test_cli_v2.py

      - name: CLI carries no principal / controller / commander tables
        # Every id and every controller/commander set comes from the sheet the
        # operator passes in (§9 of docs/issues/declarative-orchestra-spec.md).
        run: |
          if grep -rnoE '\b[a-z0-9]{5}(-[a-z0-9]{5}){3,10}-[a-z0-9]{3}\b' casals_cli scripts --exclude-dir=examples | grep -v 'aaaaa-aa\b'; then
            echo "::error::canister/principal ids belong in a casals.json, not in the CLI"; exit 1
          fi

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      # A successful production build type-checks the SvelteKit app, including
      # the Cycles page and the cycles bindings in lib/api.ts.
      - name: Build frontend
        run: npm --prefix frontend run build

      # Orchestra tree cache + footer/build-identity helpers (node:test).
      - name: Frontend lib unit tests
        run: node --experimental-strip-types --test frontend/src/lib/*.test.ts

      - name: Frontend /version build-info tests
        run: node --test frontend/scripts/build-info.test.js

  orchestration-unit:
    name: Orchestration unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      # Baton + Multisig pure helpers (no local replica). Each package is
      # pytest-run from its own directory — both ship tests/test_unit.py.
      - name: Run orchestration unit tests
        run: make -C packages/orchestration test-unit
