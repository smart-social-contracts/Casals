# Declarative e2e: the orchestra corpus on a local replica.
#
# tests/e2e/run_e2e.py starts the replica, funds the test identity, and for
# every orchestra under tests/e2e/orchestras/ runs the scenario matrix
# (fresh, idempotent, content_change, runtime_stand, retire_and_pool, drift_*,
# proposal_only, stale_plan, export_roundtrip …), grading each with
# `casals oracle`. The two product sheets (gaas, realms) run in their repos'
# own workflows because they need the product artifacts built first.

name: Orchestra corpus e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      orchestras:
        description: "Space-separated orchestra names (default: all)"
        type: string
        default: ""

jobs:
  corpus-e2e:
    name: corpus e2e (local replica)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install icp-cli and ic-wasm
        run: npm install -g @icp-sdk/icp-cli @icp-sdk/ic-wasm

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Create the test identity
        run: icp identity new local-dev --storage plaintext || true

      - name: Run the corpus
        env:
          CASALS_HOME: ${{ runner.temp }}/casals
        run: python3 -u tests/e2e/run_e2e.py ${{ inputs.orchestras }}

      - name: Stop local replica (safety net)
        if: always()
        run: icp network stop -e local || true
