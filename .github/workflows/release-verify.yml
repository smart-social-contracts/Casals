name: Verify release signature

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to check
        required: true

permissions:
  contents: read

jobs:
  verify:
    permissions:
      contents: write
    uses: smart-social-contracts/.github/.github/workflows/verify-release.yml@770dd2d252a20fd8f17dbab3c8dc21ae57678ea9 # main 2026-10-07
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      fingerprint: 6B7B038DEB77849F1F615E67CA38831314D6AA09
      revert_on_failure: ${{ github.event_name == 'release' }}

  pypi-build:
    needs: verify
    if: ${{ github.event_name == 'release' }}
    permissions:
      contents: read
    uses: ./.github/workflows/publish-pypi.yml

  # Here, not in publish-pypi.yml: PyPI Trusted Publishing refuses reusable workflows.
  pypi:
    needs: pypi-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pypi-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

  # The visitor path against what was just published: PyPI + this release.
  pypi-install-up:
    needs: pypi
    permissions:
      contents: read
    uses: ./.github/workflows/pip-install-up.yml
    with:
      from_pypi: true
      release: ${{ github.event.release.tag_name }}
