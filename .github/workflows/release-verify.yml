name: Verify release signature

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to check
        required: true

jobs:
  verify:
    permissions:
      contents: write
    uses: smart-social-contracts/.github/.github/workflows/verify-release.yml@main
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      fingerprint: 6B7B038DEB77849F1F615E67CA38831314D6AA09
      revert_on_failure: ${{ github.event_name == 'release' }}

  pypi:
    needs: verify
    if: ${{ github.event_name == 'release' }}
    permissions:
      contents: read
    uses: ./.github/workflows/publish-pypi.yml
    secrets: inherit

  # The visitor path against what was just published: PyPI + this release.
  pypi-install-up:
    needs: pypi
    permissions:
      contents: read
    uses: ./.github/workflows/pip-install-up.yml
    with:
      from_pypi: true
      release: ${{ github.event.release.tag_name }}
