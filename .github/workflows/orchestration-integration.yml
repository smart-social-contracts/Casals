# Baton + Multisig integration tests on a local replica (icp-cli).
# Runs on every PR and push to main alongside cli-e2e.
name: Orchestration integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verbose:
        description: "pytest -v"
        type: boolean
        default: true

permissions:
  contents: read

env:
  # icp-cli looks the network launcher up on the GitHub API; unauthenticated,
  # runners share one rate limit and `icp network start` fails with a 403.
  ICP_CLI_GITHUB_TOKEN: ${{ github.token }}

jobs:
  orchestration-integration:
    name: Baton + Multisig (local replica)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Install icp-cli, ic-wasm, and Motoko tooling
        run: |
          npm install -g @icp-sdk/icp-cli@1.6.0 @icp-sdk/ic-wasm@0.11.1 ic-mops@3.4.2
          export PATH="$(npm config get prefix)/bin:$PATH"
          mops --version || true

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Show toolchain versions
        run: |
          icp --version || true
          python3 -m basilisk --version || true
          pytest --version

      # Without an identity icp signs as the anonymous principal, which the
      # multisig refuses as a signer.
      - name: Create the test identity
        run: |
          export PATH="$(npm config get prefix)/bin:$PATH"
          icp identity new local-dev --storage plaintext || true

      # conftest.py in baton/tests/ starts the local replica, builds Baton,
      # Multisig, and managed-canister fixture WASMs, then drives propose →
      # execute upgrade flows. Multisig tests reuse the same helpers.
      - name: Run orchestration integration tests
        env:
          CASALS_TEST_IDENTITY: local-dev
        run: |
          export PATH="$(npm config get prefix)/bin:$PATH"
          make -C packages/orchestration test-integration

      - name: Stop local replica (safety net)
        if: always()
        run: icp network stop || true
