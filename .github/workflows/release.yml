name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Basilisk venv
        run: |
          python3 -m venv .venv-basilisk
          .venv-basilisk/bin/pip install --upgrade pip
          .venv-basilisk/bin/pip install \
            ic-basilisk==0.14.2 ic-basilisk-toolkit==0.5.3 \
            ic-python-db==0.11.0 ic-python-logging==0.3.4

      - name: Build conductor WASM
        run: |
          export PATH="$PWD/.venv-basilisk/bin:$PATH"
          export CANISTER_CANDID_PATH="$(pwd)/casals_backend.did"
          python -m basilisk casals_backend src/main.py
          gzip -kf .basilisk/casals_backend/casals_backend.wasm
          cp .basilisk/casals_backend/casals_backend.wasm.gz ./casals_conductor.wasm.gz
          cp casals_backend.did ./casals_conductor.did

      - name: Compute release asset checksums
        run: |
          echo "# SHA-256 checksums for release assets" > checksums.txt
          for f in casals_conductor.wasm.gz casals_conductor.did; do
            [ -f "$f" ] && sha256sum "$f" >> checksums.txt
          done
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            casals_conductor.wasm.gz
            casals_conductor.did
            checksums.txt
