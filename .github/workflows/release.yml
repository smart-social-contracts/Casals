name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Basilisk venv
        run: |
          python3 -m venv .venv-basilisk
          .venv-basilisk/bin/pip install --upgrade pip
          .venv-basilisk/bin/pip install \
            ic-basilisk==0.14.2 ic-basilisk-toolkit==0.5.3 \
            ic-python-db==0.11.0 ic-python-logging==0.3.4

      - name: Stamp /version placeholders
        run: |
          # GET /version (gos-as-a-service#39). Unstamped checkouts omit
          # sha / built_at / version honestly; this step bakes them in
          # before the WASM is compiled so query time never invents them.
          COMMIT="$(git rev-parse --short HEAD)"
          BUILT_AT_ISO="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          TAG="${GITHUB_REF_NAME}"
          sed -i \
            "s/VERSION_PLACEHOLDER/${TAG}/g; s/COMMIT_HASH_PLACEHOLDER/${COMMIT}/g; s/BUILT_AT_ISO_PLACEHOLDER/${BUILT_AT_ISO}/g" \
            src/version_http.py
          echo "Stamped /version: canister=casals_backend sha=${COMMIT} built_at=${BUILT_AT_ISO} version=${TAG}"

      - name: Build conductor WASM
        run: |
          export PATH="$PWD/.venv-basilisk/bin:$PATH"
          export CANISTER_CANDID_PATH="$(pwd)/casals_backend.did"
          python -m basilisk casals_backend src/main.py
          python3 scripts/fix_asset_permission_did.py casals_backend.did
          gzip -kf .basilisk/casals_backend/casals_backend.wasm
          # gaas new fetches casals_backend.wasm.gz (known.py). Keep the
          # casals_conductor.* aliases for anyone still using that name.
          cp .basilisk/casals_backend/casals_backend.wasm.gz ./casals_backend.wasm.gz
          cp .basilisk/casals_backend/casals_backend.wasm.gz ./casals_conductor.wasm.gz
          cp casals_backend.did ./casals_conductor.did

      - name: Build file-registry WASM
        run: |
          export PATH="$PWD/.venv-basilisk/bin:$PATH"
          test -f file_registry/src/main.py
          export CANISTER_CANDID_PATH="$(pwd)/file_registry/ic_file_registry.did"
          python -m basilisk ic_file_registry file_registry/src/main.py
          gzip -kf .basilisk/ic_file_registry/ic_file_registry.wasm
          cp .basilisk/ic_file_registry/ic_file_registry.wasm.gz ./file_registry.wasm.gz
          cp .basilisk/ic_file_registry/ic_file_registry.wasm.gz ./ic_file_registry.wasm.gz

      - name: Stage orchestration template WASMs
        run: |
          # gaas new / realms seed fetch these from the GitHub release instead of
          # a local Casals checkout. Committed artifacts under seed/templates/.
          cp seed/templates/orchestration-baton@1.3.0.wasm.gz ./orchestration-baton@1.3.0.wasm.gz
          cp seed/templates/orchestration-multisig@1.2.0.wasm.gz ./orchestration-multisig@1.2.0.wasm.gz

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend assets
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
          tar czf casals_frontend.tar.gz -C dist .
          echo "Frontend tarball: $(stat -c%s casals_frontend.tar.gz) bytes"

      - name: Compute release asset checksums
        run: |
          echo "# SHA-256 checksums for release assets" > checksums.txt
          for f in casals_backend.wasm.gz casals_backend.did \
                   casals_conductor.wasm.gz casals_conductor.did \
                   casals_frontend.tar.gz \
                   file_registry.wasm.gz ic_file_registry.wasm.gz \
                   orchestration-baton@1.3.0.wasm.gz orchestration-multisig@1.2.0.wasm.gz; do
            [ -f "$f" ] && sha256sum "$f" >> checksums.txt
          done
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            casals_backend.wasm.gz
            casals_backend.did
            casals_conductor.wasm.gz
            casals_conductor.did
            casals_frontend.tar.gz
            file_registry.wasm.gz
            ic_file_registry.wasm.gz
            orchestration-baton@1.3.0.wasm.gz
            orchestration-multisig@1.2.0.wasm.gz
            checksums.txt
