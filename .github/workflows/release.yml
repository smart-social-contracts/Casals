name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Basilisk venv
        run: |
          python3 -m venv .venv-basilisk
          .venv-basilisk/bin/pip install --upgrade pip
          .venv-basilisk/bin/pip install \
            ic-basilisk==0.14.2 ic-basilisk-toolkit==0.5.3 \
            ic-python-db==0.11.0 ic-python-logging==0.3.4

      - name: Stamp /version placeholders
        run: |
          # GET /version (gos-as-a-service#39). Unstamped checkouts omit
          # sha / built_at / version honestly; this step bakes them in
          # before the WASM is compiled so query time never invents them.
          COMMIT="$(git rev-parse --short HEAD)"
          BUILT_AT_ISO="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          TAG="${GITHUB_REF_NAME}"
          sed -i \
            "s/VERSION_PLACEHOLDER/${TAG}/g; s/COMMIT_HASH_PLACEHOLDER/${COMMIT}/g; s/BUILT_AT_ISO_PLACEHOLDER/${BUILT_AT_ISO}/g" \
            src/version_http.py
          echo "Stamped /version: canister=casals_backend sha=${COMMIT} built_at=${BUILT_AT_ISO} version=${TAG}"

      - name: Build conductor WASM
        run: |
          export PATH="$PWD/.venv-basilisk/bin:$PATH"
          export CANISTER_CANDID_PATH="$(pwd)/casals_backend.did"
          python -m basilisk casals_backend src/main.py
          python3 scripts/fix_asset_permission_did.py casals_backend.did
          gzip -kf .basilisk/casals_backend/casals_backend.wasm
          # gaas new fetches casals_backend.wasm.gz (known.py). Keep the
          # casals_conductor.* aliases for anyone still using that name.
          cp .basilisk/casals_backend/casals_backend.wasm.gz ./casals_backend.wasm.gz
          cp .basilisk/casals_backend/casals_backend.wasm.gz ./casals_conductor.wasm.gz
          cp casals_backend.did ./casals_conductor.did

      - name: Stage orchestration template WASMs
        run: |
          # Versions the GaaS sheet installs. Committed artifacts under seed/templates/.
          cp seed/templates/orchestration-baton@1.6.0.wasm.gz ./orchestration-baton@1.6.0.wasm.gz
          cp seed/templates/orchestration-multisig@1.7.0.wasm.gz ./orchestration-multisig@1.7.0.wasm.gz
          # The store canister, and the asset-canister module realm frontends install
          # as certified-assets@1.0.0 (same bytes as hello-world-frontend.wasm.gz).
          cp seed/templates/certified-assets@0.3.0.wasm.gz ./certified-assets@0.3.0.wasm.gz
          cp seed/templates/hello-world-frontend.wasm.gz ./certified-assets@1.0.0.wasm.gz

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"

      - name: Build frontend assets
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
          PYTHONPATH=src python3 -m casals_cli.bundle dist -o casals_frontend.tar.gz --manifest casals_frontend.manifest.json
          echo "Frontend bundle: $(stat -c%s casals_frontend.tar.gz) bytes"

      - name: Compute release asset checksums
        run: |
          echo "# SHA-256 checksums for release assets" > checksums.txt
          for f in casals_backend.wasm.gz casals_backend.did \
                   casals_conductor.wasm.gz casals_conductor.did \
                   casals_frontend.tar.gz casals_frontend.manifest.json \
                   certified-assets@0.3.0.wasm.gz \
                   certified-assets@1.0.0.wasm.gz \
                   orchestration-baton@1.6.0.wasm.gz orchestration-multisig@1.7.0.wasm.gz; do
            [ -f "$f" ] && sha256sum "$f" >> checksums.txt
          done
          python3 - << 'PY' >> checksums.txt
          import gzip, hashlib, json, pathlib
          print("# module sha256 (decompressed wasm; pin this on registry.wasms)")
          for name in (
              "casals_backend.wasm.gz",
              "certified-assets@0.3.0.wasm.gz",
              "certified-assets@1.0.0.wasm.gz",
              "orchestration-baton@1.6.0.wasm.gz",
              "orchestration-multisig@1.7.0.wasm.gz",
          ):
              data = gzip.decompress(pathlib.Path(name).read_bytes())
              print(f"{hashlib.sha256(data).hexdigest()}  {name} (module)")
          man = json.load(open("casals_frontend.manifest.json"))
          print("# bundle hash (pin this on registry.bundles)")
          print(f"{man['bundle_sha256']}  casals_frontend.tar.gz (bundle)")
          PY
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          # Stays a draft until the checksum file is signed with the release key
          # (smart-social-contracts/.github scripts/sign-release.sh).
          draft: true
          files: |
            casals_backend.wasm.gz
            casals_backend.did
            casals_conductor.wasm.gz
            casals_conductor.did
            casals_frontend.tar.gz
            casals_frontend.manifest.json
            certified-assets@0.3.0.wasm.gz
            certified-assets@1.0.0.wasm.gz
            orchestration-baton@1.6.0.wasm.gz
            orchestration-multisig@1.7.0.wasm.gz
            checksums.txt
