# Manually-triggered integration test: spins up a local replica with icp-cli,
# builds + deploys the Casals backend, and runs the integration suite.
#
# Trigger from the GitHub UI (Actions ▸ Integration ▸ Run workflow) or via:
#   gh workflow run integration.yml
name: Integration (local replica)

on:
  workflow_dispatch:
    inputs:
      verbose:
        description: "pytest -v"
        type: boolean
        default: true

permissions:
  contents: read

env:
  # icp-cli looks the network launcher up on the GitHub API; unauthenticated,
  # runners share one rate limit and `icp network start` fails with a 403.
  ICP_CLI_GITHUB_TOKEN: ${{ github.token }}

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Install icp-cli + ic-wasm
        run: npm install -g @icp-sdk/icp-cli@1.6.0 @icp-sdk/ic-wasm@0.11.1

      - name: Install backend / test dependencies
        run: pip install -r requirements-dev.txt

      # Without an identity icp signs as the anonymous principal; Casals refuses
      # anonymous callers on the store/catalog endpoints (and a real deployer is
      # never anonymous), so the suite runs as a plaintext local identity.
      - name: Create the test identity
        run: icp identity new local-dev --storage plaintext || true

      - name: Show toolchain versions
        run: |
          icp --version || true
          python3 -m basilisk --version || true

      # conftest.py starts the local replica, builds + deploys casals_backend,
      # and for the e2e suite deploys the casals-store store (the committed
      # certified-assets template) on the same replica, then drives the full
      # create/upgrade/snapshot/rollback lifecycle. The replica is stopped on
      # teardown.
      - name: Run tests (unit + integration + e2e)
        env:
          CASALS_TEST_IDENTITY: local-dev
        run: pytest tests/ ${{ inputs.verbose && '-v' || '' }}

      - name: Stop local replica (safety net)
        if: always()
        run: icp network stop || true
