# Publish ic-casals to https://pypi.org/project/ic-casals/ through PyPI Trusted
# Publishing (OIDC): no token. PyPI rejects tokens from reusable workflows, so
# this file only builds when called (release-verify.yml uploads the `pypi-dist`
# artifact itself) and builds + uploads on manual dispatch. Trusted publishers
# on pypi.org: release-verify.yml and publish-pypi.yml.
name: Publish to PyPI

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Verify version lockstep
        run: |
          PYPROJECT_VERSION=$(grep -Po '^version = "\K[^"]*' pyproject.toml)
          INIT_VERSION=$(grep -Po '^__version__ = "\K[^"]*' casals_cli/__init__.py)
          echo "pyproject.toml: ${PYPROJECT_VERSION}"
          echo "casals_cli/__init__.py: ${INIT_VERSION}"
          if [ "$PYPROJECT_VERSION" != "$INIT_VERSION" ]; then
            echo "::error::Version mismatch between pyproject.toml and casals_cli/__init__.py"
            exit 1
          fi

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
          python -c "import sys, zipfile; n = zipfile.ZipFile(sys.argv[1]).namelist(); bad = [x for x in n if not x.startswith(('casals_cli/', 'ic_casals-'))]; sys.exit(f'outside casals_cli/: {bad}' if bad else 0)" dist/*.whl

      - name: Smoke-install the wheel
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv ic-casals-wheel
          ic-casals-wheel/bin/pip install "$GITHUB_WORKSPACE"/dist/*.whl
          ic-casals-wheel/bin/casals -V
          ic-casals-wheel/bin/python -c "import importlib, pkgutil, casals_cli; [importlib.import_module('casals_cli.' + m.name) for m in pkgutil.iter_modules(casals_cli.__path__)]; print('imports ok', casals_cli.__version__)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pypi-dist
          path: dist/

  publish:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pypi-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
