# Publish ic-casals to https://pypi.org/project/ic-casals/
# Uses secrets.PYPI_API_TOKEN (same as basilisk / realms).
name: Publish to PyPI

# Called by release-verify.yml once a published release's signature checks out.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify version lockstep
        run: |
          PYPROJECT_VERSION=$(grep -Po '^version = "\K[^"]*' pyproject.toml)
          INIT_VERSION=$(grep -Po '^__version__ = "\K[^"]*' casals_cli/__init__.py)
          echo "pyproject.toml: ${PYPROJECT_VERSION}"
          echo "casals_cli/__init__.py: ${INIT_VERSION}"
          if [ "$PYPROJECT_VERSION" != "$INIT_VERSION" ]; then
            echo "::error::Version mismatch between pyproject.toml and casals_cli/__init__.py"
            exit 1
          fi

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
          python scripts/check_wheel.py dist/*.whl

      - name: Smoke-install the wheel
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv ic-casals-wheel
          ic-casals-wheel/bin/pip install "$GITHUB_WORKSPACE"/dist/*.whl
          ic-casals-wheel/bin/casals -V
          ic-casals-wheel/bin/python -c "import casals_cli, sheetv2, access_code, auth, ic_assets, commanders; print('imports ok', casals_cli.__version__)"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
