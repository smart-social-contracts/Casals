# Publish ic-casals to https://pypi.org/project/ic-casals/ through PyPI Trusted
# Publishing (OIDC): no token. PyPI matches the top-level workflow, so the
# trusted publishers on pypi.org are release-verify.yml (the release path) and
# publish-pypi.yml (manual dispatch); the caller grants `id-token: write`.
name: Publish to PyPI

# Called by release-verify.yml once a published release's signature checks out.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Verify version lockstep
        run: |
          PYPROJECT_VERSION=$(grep -Po '^version = "\K[^"]*' pyproject.toml)
          INIT_VERSION=$(grep -Po '^__version__ = "\K[^"]*' casals_cli/__init__.py)
          echo "pyproject.toml: ${PYPROJECT_VERSION}"
          echo "casals_cli/__init__.py: ${INIT_VERSION}"
          if [ "$PYPROJECT_VERSION" != "$INIT_VERSION" ]; then
            echo "::error::Version mismatch between pyproject.toml and casals_cli/__init__.py"
            exit 1
          fi

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
          python scripts/check_wheel.py dist/*.whl

      - name: Smoke-install the wheel
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv ic-casals-wheel
          ic-casals-wheel/bin/pip install "$GITHUB_WORKSPACE"/dist/*.whl
          ic-casals-wheel/bin/casals -V
          ic-casals-wheel/bin/python -c "import casals_cli, sheetv2, access_code, auth, ic_assets, commanders; print('imports ok', casals_cli.__version__)"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
