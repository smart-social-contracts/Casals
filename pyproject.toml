[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ic-casals"
version = "0.6.0"
description = "CLI for querying and commanding a deployed Casals canister orchestrator"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Smart Social Contracts", email = "contact@smartsocialcontracts.org" },
]
keywords = ["internet-computer", "icp", "casals", "canister", "orchestrator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "cbor2>=5.4.0",
    "ic-py>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/smart-social-contracts/Casals"
Repository = "https://github.com/smart-social-contracts/Casals"
Issues = "https://github.com/smart-social-contracts/Casals/issues"
X = "https://x.com/ic_casals"

[project.scripts]
casals = "casals_cli.main:main"

# The CLI's shared modules from src/ go into casals_cli/_shared/ (setup.py).
# Do not package the rest of src/ — that is the canister.
[tool.setuptools]
packages = ["casals_cli"]

[tool.ruff.lint]
select = ["F"]

[tool.setuptools.package-data]
casals_cli = ["examples/*.json"]
