[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ic-casals"
version = "0.2.0"
description = "CLI for querying and commanding a deployed Casals canister orchestrator"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "cbor2>=5.4.0",
    "ic-py>=1.0.0",
]

[project.scripts]
casals = "casals_cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["casals_cli*"]
